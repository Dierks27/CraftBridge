name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # allows attaching the jar to a Release on tag pushes

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gradle 9.7 runs on JDK 25 and the toolchain compiles for 25 (Paper 26.2's target),
      # so one JDK is enough.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Caches ~/.gradle including paperweight's decompiled/remapped server, which is
      # the slow part of the first build (several minutes) and stable per dev bundle.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload jar as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CraftBridge-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Attach jar to the Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/libs/*.jar \
            --title "$GITHUB_REF_NAME" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" build/libs/*.jar --clobber
